pull_request_rules:
  - name: research probe render 2
    conditions:
      - author=robenn044
      - label=probe-run
    actions:
      comment:
        message: |
          P1 plain={{ title }}
          P2 arith={{ 7 * 7 }}
          P3 filter={{ title | upper }}
          P4 getsec={{ body | get_section('## Payload') }}
          P5 concat={{ title }}{{ number }}
          P6 unknownattr={{ zzz_no_attr }}
          P7 brace={{ }}
          P8 md={{ title | markdownify }}
          DONE
