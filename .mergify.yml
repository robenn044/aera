queue_rules:
  - name: default
    batch_size: 2
    batch_max_wait_time: 30 seconds
    merge_method: merge-batch
    queue_conditions:
      - label=mq-go
    merge_conditions:
      - label=mq-go
      - check-success=lab-gate

pull_request_rules:
  - name: research queue probe
    conditions:
      - base=main
      - label=mq-go
      - label=co-go
    actions:
      queue:
        name: default
